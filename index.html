    <meta name="description" content="Reloj de Fibonacci instalable: la hora se suma en cuadrados de colores o se lee en la espiral de una placa negra, con la Luna en vivo. Funciona sin conexión." />
    <title>Reloj de Fibonacci</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }

      :root {
        --bg: #f4f1ea;
        --surface: #fffdf8;
        --ink: #1c1a16;
        --ink-soft: #5c564c;
        --line: #ddd5c6;
        --accent: #b07d2b;
        --sq-off: #16130e;
        --sq-off-ink: #57503f;
        --sq-h: #7c1216;
        --sq-m: #0d5230;
        --sq-b: #33206e;
        --sq-ink: #f5efdd;
        --chip-bg: #ece7da;
        --shadow: 0 18px 40px rgba(60, 48, 20, 0.14);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12100d;
          --surface: #1b1813;
          --ink: #f2ede1;
          --ink-soft: #a89e8b;
          --line: #37312a;
          --accent: #e0aa4e;
          --sq-off: #16130e;
          --sq-off-ink: #57503f;
          --sq-h: #7c1216;
          --sq-m: #0d5230;
          --sq-b: #33206e;
          --chip-bg: #26221b;
          --shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Archivo", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 54rem;
        margin: 0 auto;
        padding: 1.5rem 0.6rem 3.5rem;
      }

      h1 {
        font-size: clamp(1.9rem, 6vw, 2.9rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.05;
        margin: 0 0 0.6rem;
      }
      .lede {
        color: var(--ink-soft);
        font-size: 1.05rem;
        line-height: 1.55;
        margin: 0 0 1.75rem;
        max-width: 34rem;
      }
      .lede strong { color: var(--ink); }

      /* ---------- El reloj ---------- */
      .clock-frame {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: clamp(0.75rem, 3vw, 1.25rem);
        box-shadow: var(--shadow);
      }
      /* Vista de cuadrados: panel negro estilo oscuro, con glow neón */
      #squaresView {
        background: #060605;
        border-radius: 14px;
        padding: clamp(0.6rem, 2.4vw, 1rem);
        /* Los cuadrados conservan su tamaño de siempre, aunque el
           contenedor se haya ensanchado para la placa. */
        max-width: 41rem;
        margin-inline: auto;
      }
      #squaresView .tick-track { background: #262019; }
      #squaresView .tick-fill { background: #54ff9e; box-shadow: 0 0 8px rgba(84, 255, 158, 0.7); }
      .clock {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(5, 1fr);
        gap: clamp(5px, 1.4vw, 10px);
        aspect-ratio: 8 / 5;
      }
      .sq {
        border-radius: clamp(6px, 1.6vw, 12px);
        background: var(--sq-off);
        color: var(--sq-off-ink);
        position: relative;
        transition: background-color 0.7s ease, color 0.7s ease, box-shadow 0.7s ease;
        overflow: hidden;
      }
      .sq .num {
        position: absolute;
        right: 8%;
        bottom: 4%;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-weight: 600;
        line-height: 1;
        opacity: 0.9;
        transition: opacity 0.3s ease;
      }
      .sq5 .num { font-size: clamp(1.6rem, 7vw, 3rem); }
      .sq3 .num { font-size: clamp(1.2rem, 5vw, 2.1rem); }
      .sq2 .num { font-size: clamp(0.95rem, 3.6vw, 1.5rem); }
      .sq1 .num { font-size: clamp(0.7rem, 2.6vw, 1rem); right: 10%; bottom: 6%; }
      .hide-nums .num { opacity: 0; }
      .sq5 { grid-area: 1 / 1 / 6 / 6; }
      .sq3 { grid-area: 1 / 6 / 4 / 9; }
      .sq2 { grid-area: 4 / 6 / 6 / 8; }
      .sq1a { grid-area: 4 / 8 / 5 / 9; }
      .sq1b { grid-area: 5 / 8 / 6 / 9; }
      .sq.h { background: var(--sq-h); color: var(--sq-ink); box-shadow: 0 0 18px rgba(168, 110, 255, 0.45), inset 0 0 14px rgba(168, 110, 255, 0.25); }
      .sq.m { background: var(--sq-m); color: var(--sq-ink); box-shadow: 0 0 18px rgba(84, 255, 158, 0.4), inset 0 0 14px rgba(84, 255, 158, 0.22); }
      .sq.b { background: var(--sq-b); color: var(--sq-ink); box-shadow: 0 0 18px rgba(150, 120, 255, 0.5), inset 0 0 14px rgba(84, 255, 158, 0.18); }

      /* Barra de segundos dentro del bloque de 5 minutos */
      .tick-track {
        height: 4px;
        background: var(--chip-bg);
        border-radius: 99px;
        margin-top: clamp(0.75rem, 3vw, 1.25rem);
        overflow: hidden;
      }
      .tick-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        border-radius: 99px;
      }

      /* ---------- Vista de manecillas: placa y espiral ---------- */
      [hidden] { display: none !important; }
      /* Fondo tipo pared oscura en ambos modos, como las paredes de las
         fotos: la placa se despega bien del fondo, y la espiral
         principal —más grande que la placa— se sigue leyendo cuando
         su punta se sale por los lados, como en la imagen de
         referencia. */
      .hands-wrap {
        position: relative;
        display: flex;
        justify-content: center;
        background: linear-gradient(165deg, #39435a 0%, #252d3f 55%, #141a26 100%);
        border-radius: 14px;
        padding: clamp(0.4rem, 2vw, 0.9rem) 0.25rem;
        overflow: visible;
        /* Material de la placa: negro (por defecto, como la foto) */
        --p-num: #16161a;
        --p-spiral: #101014;
        --p-min: #16161a;
        --p-tick: #16161a;
        --p-dial: rgba(22, 22, 28, 0.42);
        --p-dialnum: rgba(22, 22, 28, 0.52);
        --p-ecl: rgba(22, 22, 28, 0.16);
        --p-dialface: rgba(255, 255, 255, 0.28);
        --p-dialring: rgba(22, 22, 28, 0.62);
        --p-label: #26262b;
        --p-moonsh: #41464f;
        --p-rim: rgba(18, 18, 24, 0.4);
        --p-bstroke: rgba(12, 12, 16, 0.55);
        --p-hl: #c2185b;
        --p-star1: #2e333d;
        --p-star2: #3d4c74;
        --p-star3: #6d5a33;
        --p-ghostop: 0.2;
      }
      /* Cielo estrellado de fondo, detrás de la placa */
      #bgStars {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .bg-star { fill: #dfe8ff; }
      .moon-smoke { fill: rgba(14, 16, 24, 0.66); filter: url(#smokeBlur); }
      .moon-smoke2 { fill: rgba(148, 160, 190, 0.20); filter: url(#smokeBlur2); }
      .hands-wrap[data-material="negro"] {
        /* Los números van en ámbar, distinto del blanco de la espiral
           y de las líneas, para que se lean también cuando la espiral
           pasa por detrás de ellos. */
        --p-num: #f5b942;
        --p-spiral: #e8e6df;
        --p-min: #cfccc2;
        --p-tick: #ece9e0;
        --p-dial: rgba(236, 233, 224, 0.5);
        --p-dialnum: rgba(236, 233, 224, 0.55);
        --p-ecl: rgba(236, 233, 224, 0.28);
        --p-dialface: rgba(255, 255, 255, 0.06);
        --p-dialring: rgba(236, 233, 224, 0.78);
        --p-label: #d8d5cc;
        --p-moonsh: #7a828f;
        --p-rim: rgba(236, 233, 224, 0.5);
        --p-bstroke: rgba(236, 233, 224, 0.4);
        --p-hl: #c2185b;
        --p-star1: #c9cdd6;
        --p-star2: #8fa3d9;
        --p-star3: #d9b96a;
        --p-ghostop: 0.22;
      }
      .star-a { fill: var(--p-star1); }
      .star-b { fill: var(--p-star2); }
      .star-c { fill: var(--p-star3); }
      .plate { width: min(100%, 46rem); height: auto; display: block; overflow: visible; }
      .plate-body {
        stroke: var(--p-bstroke);
        stroke-width: 2;
        filter: drop-shadow(0 16px 20px rgba(8, 10, 14, 0.55));
      }
      /* Las líneas y la espiral de la imagen de referencia: sobre la
         placa van grabadas las 12 espirales finas —la misma curva
         logarítmica repetida cada 30°, en trazo tenue— y por encima
         gira la espiral principal como figura: una cinta que se afina
         hasta enroscarse en el centro y crece hacia fuera, más grande
         que la placa, así que su punta se sale por los lados como en
         la foto. El número de la hora en curso y su marquita se
         encienden en rosa. */
      .spiral-arm { fill: var(--p-spiral); stroke: none; }
      .spiral-out { fill: #e7e9ee; stroke: none; }
      .ghost { fill: none; stroke: var(--p-spiral); stroke-width: 1; opacity: var(--p-ghostop, 0.2); }
      .cast { filter: drop-shadow(calc(var(--sx, 6px) * 3) calc(var(--sy, 10px) * 3) calc(var(--sb, 14px) * 1.8) rgba(8, 10, 14, var(--so, 0.4))); }
      .cast2 { filter: drop-shadow(calc(var(--sx, 6px) * 1.6) calc(var(--sy, 10px) * 1.6) calc(var(--sb, 14px) * 0.9) rgba(8, 10, 14, var(--so, 0.4))); --amp: 2.5px; }
      .float { --amp: 4px; animation: lev 7s ease-in-out infinite; }
      @keyframes lev { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--amp) * -1)); } }
      .par { transform: translate(calc(var(--px, 0) * 5px), calc(var(--py, 0) * 5px)); transition: transform 0.3s ease-out; }
      @media (prefers-reduced-motion: reduce) { .float { animation: none; } .par { transform: none !important; } }
      /* Centro sutil: sin círculo ni aro, solo las marcas y los
         números de los minutos, tenues, y una manecilla fina. */
      .dial-face { display: none; }
      .dial-ring { display: none; }
      .dial-tick { stroke: var(--p-dial); stroke-linecap: round; }
      .hand-min { fill: var(--p-hl); opacity: 1; }
      .hub { fill: var(--p-hl); }
      .hand-spiral { fill: none; stroke: var(--p-hl); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
      .hub-dot { fill: var(--p-num); stroke: none; opacity: 0.7; }
      /* Líneas que rebotan dentro de las espirales: tres por espiral,
         cada una a su velocidad. El movimiento lo lleva JavaScript
         (stroke-dasharray y stroke-dashoffset), no una animación CSS. */
      .flow, .flow-glow {
        fill: none;
        stroke-linecap: round;
        pointer-events: none;
      }
      .flow-h { stroke: #ffd27a; stroke-width: 2.2; }
      .flow-glow-h { stroke: #f5b942; stroke-width: 8; opacity: 0.28; }
      .flow-m { stroke: #ff7fb0; stroke-width: 1.4; }
      .flow-glow-m { stroke: #c2185b; stroke-width: 5; opacity: 0.4; }
      @media (prefers-reduced-motion: reduce) { .flow, .flow-glow { display: none; } }
      /* ---------- Cielo vivo de la placa ---------- */
      .aurora {
        position: absolute;
        inset: 0;
        height: 55%;
        overflow: hidden;
        border-radius: 14px 14px 0 0;
        opacity: 0;
        transition: opacity 1.4s ease;
        pointer-events: none;
      }
      .aur-band {
        position: absolute;
        left: -15%;
        width: 130%;
        height: 62%;
        top: -20%;
        background: linear-gradient(100deg, rgba(84, 255, 158, 0) 5%, rgba(84, 255, 158, 0.5) 32%, rgba(120, 220, 255, 0.26) 55%, rgba(168, 110, 255, 0.36) 78%, rgba(168, 110, 255, 0) 96%);
        filter: blur(16px);
        transform: rotate(-7deg);
        animation: aurSway 11s ease-in-out infinite alternate;
      }
      .aur-b {
        top: 8%;
        height: 46%;
        opacity: 0.7;
        transform: rotate(-4deg);
        animation-duration: 16s;
        animation-delay: -6s;
      }
      @keyframes aurSway {
        from { transform: rotate(-7deg) translateX(-2.5%); }
        to { transform: rotate(-4.5deg) translateX(2.5%); }
      }
      .plate { position: relative; z-index: 1; }
      .sky-label { font-family: "Archivo", system-ui, sans-serif; font-weight: 600; fill: var(--p-label); text-anchor: middle; }
      .moon-shadow { fill: var(--p-moonsh); }
      .moon-lit { fill: #f7f1dc; }
      .moon-rim { fill: none; stroke: var(--p-rim); stroke-width: 1.2; }
      .moon-pct { font-family: "IBM Plex Mono", ui-monospace, monospace; fill: var(--p-label); text-anchor: middle; }
      @media (prefers-reduced-motion: reduce) {
        .aur-band { animation: none; }
      }
      .dial-num {
        font-family: "Archivo", system-ui, sans-serif;
        font-weight: 600;
        fill: var(--p-dialnum);
        text-anchor: middle;
        dominant-baseline: central;
      }
      .min-num { display: none; font-family: "Archivo", system-ui, sans-serif; font-weight: 600; fill: var(--p-dialnum); text-anchor: middle; dominant-baseline: alphabetic; paint-order: stroke; stroke: rgba(5, 5, 8, 0.9); stroke-width: 2.4; stroke-linejoin: round; }
      .min-tick { fill: none; stroke: var(--p-tick); stroke-width: 2.2; stroke-linecap: round; opacity: 0.75; }
      .min-tick.minor { stroke-width: 0.9; opacity: 0.38; }
      .min-num.on { display: inline; fill: var(--p-hl); }
      .min-tick.on { stroke: var(--p-hl); stroke-width: 3; opacity: 1; }
      .min-tick.minor.on { stroke-width: 1.35; opacity: 0.92; }

      .plate-nums { transition: opacity 0.3s ease; }
      .hide-nums .plate-nums { opacity: 0; }
      .plate-num {
        display: none;
        font-family: "Archivo", system-ui, sans-serif;
        font-weight: 700;
        fill: var(--p-num);
        text-anchor: middle;
        dominant-baseline: alphabetic;
        /* Halo oscuro alrededor de cada número: aunque la espiral
           blanca pase justo por detrás, el número nunca se pierde. */
        paint-order: stroke;
        stroke: rgba(5, 5, 8, 0.92);
        stroke-width: 3.2;
        stroke-linejoin: round;
      }
      /* Carlos: se ocultan los números y se dejan las marcas: las
         marquitas blancas de las horas (.plate-tick) y las marcas de
         los arcos de minutos (.min-tick) quedan visibles, y el
         resaltado en rosa va en las marcas (hora y minuto en curso). */
      .plate-tick { stroke: var(--p-tick); stroke-width: 5.4; stroke-linecap: round; }
      .plate-num.on { display: inline; fill: var(--p-hl); }
      .plate-tick.on { stroke: var(--p-hl); stroke-width: 6.6; }

      /* ---------- Lectura digital y desglose ---------- */
      .readout {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: center;
        text-align: center;
        gap: 0.5rem 1.25rem;
        margin-top: 0.75rem;
      }
      .digital {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: clamp(1.35rem, 4.5vw, 1.8rem);
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1;
      }
      .digital .sec { font-size: 0.45em; color: var(--ink-soft); font-weight: 500; }
      .dateline { color: var(--ink-soft); font-size: 0.85rem; }
      .dateline::first-letter { text-transform: uppercase; }

      .breakdown {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 1.1rem;
      }
      .chip {
        background: var(--chip-bg);
        border-radius: 9px;
        padding: 0.38rem 0.65rem;
        font-size: 0.85rem;
        line-height: 1.35;
      }
      .chip .dot {
        display: inline-block;
        width: 0.65em; height: 0.65em;
        border-radius: 3px;
        margin-right: 0.45em;
        vertical-align: baseline;
      }
      .chip b { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 600; }
      .dot-h { background: var(--sq-h); }
      .dot-m { background: var(--sq-m); }
      .dot-b { background: var(--sq-b); }

      /* ---------- Controles ---------- */
      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.45rem;
        margin-top: 1.6rem;
      }
      .controls.is-hidden {
        display: none;
      }
      /* ---------- Barra de vista (siempre visible) ---------- */
      .viewbar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        margin-top: 0.9rem;
      }
      .view-switch {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--ink-soft);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 0.22rem 0.55rem;
        cursor: pointer;
      }
      .view-switch .vs-label { opacity: 0.55; }
      .view-switch .vs-hands { opacity: 1; }
      .view-switch.is-squares .vs-hands { opacity: 0.55; }
      .view-switch.is-squares .vs-sq { opacity: 1; }
      .view-switch .vs-track {
        width: 1.9rem;
        height: 1rem;
        border-radius: 99px;
        background: var(--line);
        position: relative;
        flex-shrink: 0;
      }
      .view-switch .vs-knob {
        position: absolute;
        top: 0.12rem;
        left: 0.12rem;
        width: 0.76rem;
        height: 0.76rem;
        border-radius: 50%;
        background: var(--ink);
        transition: left 0.15s ease;
      }
      .view-switch.is-squares .vs-knob { left: 1.02rem; }
      .btn-mini {
        font: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--ink-soft);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 0.28rem 0.6rem;
        min-height: 1.7rem;
        cursor: pointer;
      }
      .btn {
        font: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        padding: 0.32rem 0.72rem;
        min-height: 2rem;
        border-radius: 99px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }
      .btn:hover { border-color: var(--accent); }
      .btn[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        .btn.primary { color: #1c1503; }
      }
      .btn[hidden] { display: none; }

      /* Pista discreta de lectura, mientras se aprende a leer el reloj */
      .read-hint {
        text-align: center;
        color: var(--ink-soft);
        font-size: 0.8rem;
        line-height: 1.45;
        max-width: 30rem;
        margin: 0.9rem auto 0;
        opacity: 0.75;
      }

      /* ---------- Instalación (app instalable) ---------- */
      .install-panel {
        margin: 1.1rem auto 0;
        max-width: 32rem;
        background: var(--chip-bg);
        border-radius: 12px;
        padding: 0.95rem 1.05rem;
        font-size: 0.9rem;
        line-height: 1.55;
        text-align: left;
      }
      .install-panel h2 { font-size: 1rem; margin: 0 0 0.3rem; }
      .install-panel p { margin: 0.35rem 0; }
      .install-panel ol { margin: 0.35rem 0; padding-left: 1.2rem; }
      .install-panel li { margin: 0.2rem 0; }
      .install-panel .close-row { text-align: right; margin-top: 0.5rem; }
      .install-note {
        text-align: center;
        color: var(--ink-soft);
        font-size: 0.88rem;
        margin: 1rem auto 0;
      }

      footer {
        margin-top: 3rem;
        color: var(--ink-soft);
        font-size: 0.9rem;
        line-height: 1.55;
      }

      @media (prefers-reduced-motion: reduce) {
        .sq { transition: none; }
      }
      /* Ajuste a celular: la placa y los cuadrados llenan el ancho sin deformarse */
      @media (max-width: 640px) {
        main { padding: 0.75rem 0.3rem 2rem; }
        .clock-frame { padding: 0.4rem; }
        .hands-wrap { padding: 0.25rem 0; }
        .plate { width: 160%; max-width: none; flex-shrink: 0; }
        #squaresView { max-width: none; }
        body { overflow-x: hidden; }
      }

    </style>
  </head>
  <body>
    <main>
      <div class="clock-frame">
        <div id="squaresView" hidden>
          <div class="clock" id="clock" role="img" aria-label="Reloj de Fibonacci">
            <div class="sq sq5" data-v="5"><span class="num">5</span></div>
            <div class="sq sq3" data-v="3"><span class="num">3</span></div>
            <div class="sq sq2" data-v="2"><span class="num">2</span></div>
            <div class="sq sq1 sq1a" data-v="1"><span class="num">1</span></div>
            <div class="sq sq1 sq1b" data-v="1"><span class="num">1</span></div>
          </div>
          <div class="tick-track" aria-hidden="true"><div class="tick-fill" id="tickFill"></div></div>
        </div>
        <div class="hands-wrap" id="handsView" data-material="negro">
          <div class="aurora" id="aurora" aria-hidden="true"><div class="aur-band aur-a"></div><div class="aur-band aur-b"></div></div>
          <svg id="bgStars" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
          <svg class="plate" id="plateSvg" viewBox="-28 -20 696 796" role="img" aria-label="Reloj de placa negra con espiral de Fibonacci">
            <defs>
              <filter id="smokeBlur" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="2.2"></feGaussianBlur>
              </filter>
              <filter id="smokeBlur2" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="5"></feGaussianBlur>
              </filter>
              <radialGradient id="moonGlow"><stop offset="0.4" stop-color="#cfd8ff" stop-opacity="0.26"></stop><stop offset="1" stop-color="#cfd8ff" stop-opacity="0"></stop></radialGradient>
              <clipPath id="moonClip"><circle cx="424" cy="104" r="44"></circle></clipPath>
              <linearGradient id="blackGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#26262b"></stop>
                <stop offset="0.45" stop-color="#101013"></stop>
                <stop offset="0.75" stop-color="#1a1a1f"></stop>
                <stop offset="1" stop-color="#060607"></stop>
              </linearGradient>
              <clipPath id="plateClip"><rect x="140" y="28" width="360" height="720" rx="14"></rect></clipPath>
              <clipPath id="plateNoMoonClip"><path clip-rule="evenodd" d="M140 28H500V748H140Z M374 104 A50 50 0 1 0 474 104 A50 50 0 1 0 374 104 Z"></path></clipPath>
              <clipPath id="outsideClip"><path clip-rule="evenodd" d="M-200 -200H900V1100H-200Z M154 28H486Q500 28 500 42V734Q500 748 486 748H154Q140 748 140 734V42Q140 28 154 28Z"></path></clipPath>
            </defs>
            <rect class="plate-body" id="plateBody" x="140" y="28" width="360" height="720" rx="14" fill="url(#blackGrad)"></rect>
            <!-- La espiral va siempre por detrás de todo lo demás de la
                 placa —números, marquitas, Luna y carátula de minutos—,
                 para que al pasar sobre un número nunca lo oculte. -->
            <g>
              <g class="cast float"><g class="par"><g id="spiralArm"><path class="spiral-arm" id="spiralPath" d=""></path></g></g></g>
              <g clip-path="url(#outsideClip)"><g class="float"><g class="par"><g id="spiralArm2"><path class="spiral-out" id="spiralPathOut" d=""></path></g></g></g></g>
            </g>
            <g id="skyLayer" clip-path="url(#plateClip)"></g>
            <g id="ghosts" clip-path="url(#plateClip)"></g>
            <g id="plateNums" class="plate-nums"></g>
            <g id="minuteDial"></g>
            <g class="cast2 float"><g id="handMinute"><polygon class="hand-min" points="320,346 321.5,384 320,398 318.5,384"></polygon></g>
            <circle class="hub" cx="320" cy="388" r="2.6"></circle>
            <circle class="hub-dot" cx="320" cy="388" r="1"></circle></g>
          </svg>
        </div>
      </div>

      <div class="readout">
        <div class="digital" id="digital">--:--<span class="sec">--</span></div>
        <div class="dateline" id="dateline"></div>
      </div>

      <div class="viewbar">
        <button class="view-switch" id="viewSwitch" role="switch" aria-checked="false" title="Cambiar a Cuadrados">
          <span class="vs-label vs-hands">Manecillas</span>
          <span class="vs-track"><span class="vs-knob"></span></span>
          <span class="vs-label vs-sq">Cuadrados</span>
        </button>
        <button class="btn-mini" id="btnControlsToggle" aria-expanded="false" title="Mostrar controles">Controles</button>
      </div>

      <div class="breakdown" id="breakdown" hidden>
        <div class="chip"><span class="dot dot-h"></span><span class="dot dot-b" style="margin-left:-0.35em"></span>Horas: <b id="hoursSum">–</b></div>
        <div class="chip"><span class="dot dot-m"></span><span class="dot dot-b" style="margin-left:-0.35em"></span>Minutos: <b id="minutesSum">–</b></div>
      </div>

      <div class="controls is-hidden" id="controlsBar">
        <button class="btn" id="btnLive" aria-pressed="true">En vivo</button>
        <button class="btn" id="btnPractice" aria-pressed="false">Practicar</button>
        <button class="btn primary" id="btnNew" hidden>Nueva hora</button>
        <button class="btn" id="btnReveal" hidden>Revelar la hora</button>
        <button class="btn" id="btnViewSq" aria-pressed="false">Cuadrados</button>
        <button class="btn" id="btnViewHands" aria-pressed="true">Manecillas</button>
        <button class="btn" id="btnNums" aria-pressed="true">Números visibles</button>
        <button class="btn primary" id="btnInstall" hidden>Instalar el reloj</button>
      </div>

      <p class="read-hint" id="readHint">La espiral cruza la marca de la hora en curso, que se enciende en rosa. La manecilla del centro marca los minutos.</p>

      <div class="install-panel" id="installPanel" hidden>
        <h2>Instalar en este dispositivo</h2>
        <div id="installSteps"></div>
        <div class="close-row"><button class="btn" id="btnInstallClose">Cerrar</button></div>
      </div>
      <p class="install-note" id="installedNote" hidden>El reloj ya está instalado en este dispositivo: búscalo por su icono de la espiral.</p>

    </main>

    <script>
      (function () {
        var VALUES = [5, 3, 2, 1, 1]; // en el orden de los cuadrados en el DOM
        var squares = Array.prototype.slice.call(document.querySelectorAll(".sq"));
        var digitalEl = document.getElementById("digital");
        var datelineEl = document.getElementById("dateline");
        var hoursSumEl = document.getElementById("hoursSum");
        var minutesSumEl = document.getElementById("minutesSum");
        var exampleEl = null;
        var tickFill = document.getElementById("tickFill");
        var clockEl = document.getElementById("clock");
        var breakdownEl = document.getElementById("breakdown");
        var squaresEl = document.getElementById("squaresView");
        var handsEl = document.getElementById("handsView");
        var plateEl = document.getElementById("plateSvg");
        var handMinute = document.getElementById("handMinute");

        var btnLive = document.getElementById("btnLive");
        var btnPractice = document.getElementById("btnPractice");
        var btnNew = document.getElementById("btnNew");
        var btnReveal = document.getElementById("btnReveal");
        var btnViewSq = document.getElementById("btnViewSq");
        var btnViewHands = document.getElementById("btnViewHands");
        var viewSwitch = document.getElementById("viewSwitch");
        var btnControlsToggle = document.getElementById("btnControlsToggle");
        var controlsBar = document.getElementById("controlsBar");
        var btnNums = document.getElementById("btnNums");
        var readHintEl = document.getElementById("readHint");

        var mode = "live";           // "live" | "practice"
        var view = "hands";          // "squares" | "hands" (la carátula de manecillas es la vista principal)
        var revealed = true;
        var practiceTime = null;     // {h: 1-12, mUnits: 0-11}
        var lastShown = null;        // último tiempo dibujado {h, mUnits}

        // La placa sigue el diseño de la imagen de referencia: las 12
        // espirales finas grabadas sobre toda la placa y la espiral
        // principal como figura —una cinta que gira una vuelta cada
        // 12 horas y cruza la marca de la hora en curso—, que se
        // enciende en rosa.
        // La geometría de los números sigue siendo la de la espiral
        // logarítmica: cada número está en el ángulo PHI[h], a la
        // distancia a la que la espiral lo cruzaría a su hora.
        //
        // Geometría: la espiral es logarítmica, ln(radio) = SP_A +
        // SP_B·θ (θ en grados), y gira 30° por hora. El número de la
        // hora h está fijo en el ángulo PHI[h], a la distancia que da
        // la propia espiral para esa hora, de modo que al girar, la
        // espiral lo cruza justo cuando es su hora. Los números van en
        // dos arcos: del 7 al 12 subiendo por la izquierda (el 7 cerca
        // del centro, el 12 arriba) y del 1 al 6 bajando por la derecha.
        var CENTER = { x: 320, y: 388 };
        // Líneas que rebotan dentro de las espirales: tres por espiral
        // (horas y minutos), cada una con su largo y su velocidad
        // (unidades de pathLength por segundo; el camino mide 1000).
        // En lugar de entrar desde afuera y salir por el centro, van y
        // vienen: rebotan en los extremos de la espiral y, al chocar
        // entre sí, intercambian velocidades.

              item.el.style.filter = item.glow
                ? "drop-shadow(0 0 5px " + strokeTone + ")"
                : "drop-shadow(0 0 3px " + strokeTone + ") drop-shadow(0 0 7px " + strokeTone + ")";
              item.el.style.strokeWidth = (item.w * fw).toFixed(2);
              item.el.style.opacity = Math.min(1, item.o + b.flash * 0.5).toFixed(2);
            }
          }
        }
        var lastBounce = null;
        function bounceLoop(ts) {
          if (lastBounce === null) lastBounce = ts;
          var dt = Math.min(0.05, (ts - lastBounce) / 1000);
          lastBounce = ts;
          stepBouncers(bouncersH, dt);
          stepBouncers(bouncersM, dt);
          requestAnimationFrame(bounceLoop);
        }
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          requestAnimationFrame(bounceLoop);
        }

        tick();
        setInterval(tick, 500);
      })();
    </script>
    <script>
      // Service worker: tras la primera visita, el reloj abre sin conexión.
      // sw.js está en la raíz, junto a index.html, para que su ámbito cubra la
      // página (un service worker dentro de assets/ no puede controlar index.html
      // en GitHub Pages, que no permite la cabecera Service-Worker-Allowed).
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
    </script>
    <script>
      // Instalación: el botón usa el aviso nativo del navegador cuando
      // existe (Android, Windows y Mac con Chrome o Edge). En iPhone y
      // iPad, donde iOS no ofrece ese aviso, el botón abre la guía de
      // «Añadir a pantalla de inicio». Si el reloj ya está instalado,
      // el botón no aparece.
      (function () {
        var btn = document.getElementById("btnInstall");
        var panel = document.getElementById("installPanel");
        var steps = document.getElementById("installSteps");
        var note = document.getElementById("installedNote");
        var deferred = null;
        var standalone = window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;
        var ua = navigator.userAgent || "";
        var isIOS = /iphone|ipad|ipod/i.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isAndroid = /android/i.test(ua);

        if (standalone) {
          note.hidden = false;
          return;
        }
        window.addEventListener("beforeinstallprompt", function (e) {
          e.preventDefault();
          deferred = e;
          btn.hidden = false;
        });
        window.addEventListener("appinstalled", function () {
          deferred = null;
          btn.hidden = true;
          panel.hidden = true;
          note.hidden = false;
        });
        // iOS nunca lanza beforeinstallprompt: el botón se muestra
        // directamente y lleva a la guía.
        if (isIOS) btn.hidden = false;

        function guide() {
          var html;
          if (isIOS) {
            html = "<p>En iPhone y iPad la instalación se hace desde Safari:</p><ol>" +
              "<li>Toca el botón <strong>Compartir</strong> (el cuadrado con la flecha hacia arriba).</li>" +
              "<li>Elige <strong>«Añadir a pantalla de inicio»</strong>.</li>" +
              "<li>Toca <strong>Añadir</strong>. El reloj quedará como una app más, con su icono de la espiral, y abrirá sin conexión.</li></ol>";
          } else if (isAndroid) {
            html = "<p>En Android:</p><ol>" +
              "<li>Abre el menú del navegador (los tres puntos, arriba a la derecha).</li>" +
              "<li>Elige <strong>«Instalar app»</strong> o <strong>«Añadir a pantalla de inicio»</strong>.</li>" +
              "<li>Confirma con <strong>Instalar</strong>. El reloj quedará en tus aplicaciones, con su icono de la espiral.</li></ol>";
          } else {
            html = "<p>En Windows y Mac:</p><ol>" +
              "<li>Busca en la barra de direcciones el icono de <strong>instalar</strong> (una pantalla con una flecha hacia abajo), a la derecha.</li>" +
              "<li>O abre el menú del navegador y elige <strong>«Instalar Reloj de Fibonacci»</strong>.</li>" +
              "<li>El reloj se abrirá en su propia ventana, como cualquier programa, y funcionará sin conexión.</li></ol>";
          }
          steps.innerHTML = html;
          panel.hidden = false;
        }

        btn.addEventListener("click", function () {
          if (deferred) {
            // Se abre el aviso de instalación propio del navegador
            // (el evento guardado de beforeinstallprompt); no es un
            // diálogo de la página.
            deferred["prompt"]();
            deferred.userChoice.then(function (choice) {
              if (choice && choice.outcome === "accepted") {
                btn.hidden = true;
                note.hidden = false;
              }
              deferred = null;
            });
          } else {
            guide();
          }
        });
        document.getElementById("btnInstallClose").addEventListener("click", function () {
          panel.hidden = true;
        });
      })();
    </script>
  </body>
</html>
